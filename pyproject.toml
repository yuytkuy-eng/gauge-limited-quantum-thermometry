[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-thermometry"
version = "0.1.0"
description = "Gauge-limited self-calibration and robust resource design in collisional quantum thermometry"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Shifan Yu", email = "yuytkuy@stu.xjtu.edu.cn"},
]
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.8,<4",
]

[project.urls]
Repository = "https://github.com/yuytkuy-eng/gauge-limited-quantum-thermometry"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
